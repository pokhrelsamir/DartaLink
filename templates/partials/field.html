<div class="field{% if field.errors %} has-error{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label for="{{ field.id_for_label }}" style="font-weight:500">{{ field }}{{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="muted" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  {% for e in field.errors %}<div class="err" role="alert">{{ e }}</div>{% endfor %}
</div>
