{% extends "base.html" %}
{% block title %}{{ message.subject }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ message.subject }}</h1><p>Message from {{ message.sender.display_name }} · {{ message.created_at|date:"d M Y, H:i" }}</p></div></div>
<section class="card">
  <div class="card-body">
    <div style="white-space:pre-wrap">{{ message.body }}</div>
  </div>
</section>
<div class="actions" style="margin-top:20px">
  <a class="btn" href="{% url 'notifications:list' %}">Back to notifications</a>
</div>
{% endblock %}
