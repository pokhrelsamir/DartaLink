{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1></div></div>
<section class="card" style="max-width:520px"><div class="card-body"><form method="post" novalidate>{% csrf_token %}
  {% for f in form %}{% include "partials/field.html" with field=f %}{% endfor %}
  <button class="btn btn-primary" type="submit">Update password</button></form></div></section>
{% endblock %}
